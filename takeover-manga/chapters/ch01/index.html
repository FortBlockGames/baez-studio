<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=DM+Mono&family=DM+Sans&display=swap" rel="stylesheet">
<style>
:root{--ink:#080a0f}*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a0f;color:#cdd0db;font-family:'DM Sans',sans-serif}
header{background:rgba(8,10,15,.92);border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;padding:13px 20px}
.lg{font-family:'Bebas Neue';font-size:21px;letter-spacing:4px;color:#f0f2f8}.lg small{color:#2B7FFF;font-size:11px;letter-spacing:3px;margin-left:9px}
.meta{font-family:'DM Mono';font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#3a4055}
.reader{max-width:780px;margin:0 auto;padding:24px 10px 80px}
.stage{position:relative;margin:0 0 22px;line-height:0}
.stage img{width:100%;display:block;border-radius:5px;border:1px solid rgba(255,255,255,.06)}
.layer{position:absolute;inset:0;line-height:1}
.bub,.cap{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2.6px solid #0a0a0a;color:#0a0a0a;
 font-family:'Anton';text-transform:uppercase;text-align:center;line-height:1.03;letter-spacing:.3px;
 font-size:clamp(8px,1.5vw,15px);box-shadow:2px 3px 0 rgba(0,0,0,.24)}
.bub{border-radius:50%/44%;padding:.75em .95em}.cap{padding:.5em .7em}
.name{position:absolute;transform:translate(-50%,-50%);background:#111;color:#fff;font-family:'Bebas Neue';letter-spacing:1.5px;padding:.35em .7em;font-size:clamp(8px,1.5vw,13px);border-radius:2px}
.sfx{position:absolute;transform:translate(-50%,-50%) rotate(-8deg);color:#fff;-webkit-text-stroke:2.6px #111;font-family:'Anton';font-size:clamp(20px,5vw,44px);letter-spacing:1px}
.bub::before,.bub::after{content:"";position:absolute;width:0;height:0;border-style:solid}
.bub.dl::before{left:16%;bottom:-15px;border-width:15px 12px 0 0;border-color:#0a0a0a transparent transparent transparent}
.bub.dl::after{left:calc(16% + 3px);bottom:-10px;border-width:11px 8px 0 0;border-color:#fff transparent transparent transparent}
.bub.dr::before{right:16%;bottom:-15px;border-width:15px 0 0 12px;border-color:#0a0a0a transparent transparent transparent}
.bub.dr::after{right:calc(16% + 3px);bottom:-10px;border-width:11px 0 0 8px;border-color:#fff transparent transparent transparent}
.bub.ul::before{left:16%;top:-15px;border-width:0 12px 15px 0;border-color:transparent transparent #0a0a0a transparent}
.bub.ul::after{left:calc(16% + 3px);top:-10px;border-width:0 8px 11px 0;border-color:transparent transparent #fff transparent}
.pnum{position:absolute;top:9px;left:9px;z-index:5;background:rgba(8,10,15,.8);border:1px solid rgba(255,255,255,.06);color:#3a4055;font-family:'DM Mono';font-size:9px;letter-spacing:2px;padding:3px 8px;border-radius:5px}
.end{text-align:center;padding:50px 20px;border:1px dashed #1c2030;border-radius:12px}
.end h2{font-family:'Bebas Neue';font-size:40px;letter-spacing:3px;color:#f0f2f8}.end p{font-weight:300;color:#3a4055;max-width:430px;margin:12px auto 22px;line-height:1.6}
.cta{display:inline-block;background:#2B7FFF;color:#fff;text-decoration:none;font-family:'DM Mono';font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:14px 28px;border-radius:9px}
footer{text-align:center;font-family:'DM Mono';font-size:9px;letter-spacing:2px;color:#3a4055;padding:26px}
</style></head><body>
<header><div class="lg">TAKEOVER<small>CH.1 · COLLATERAL</small></div><div class="meta">FBG Universe · 2577 PE</div></header>
<div class="reader" id="R"></div>
<footer>A FORT BLOCK GAMES MANGA · TAKEOVER STUDIO</footer>
<script>
const P=[
 {lbl:'COVER',img:'pages/cover.png',items:[{k:'cap',t:'CHAPTER ONE · COLLATERAL',cx:50,cy:97,mw:44}]},
 {lbl:'McCLAINE · NARRATOR',img:'pages/narrator.png',items:[
   {k:'cap',t:'YEAR 2577. FIVE CORPOS OWN EVERYTHING.',cx:23,cy:6,mw:38},
   {k:'cap',t:'EIGHT BANNERS FIGHT OVER EVERY DISTRICT. ALL WITH BOTS LIKE ME.',cx:78,cy:8,mw:34},
   {k:'name',t:'McCLAINE',cx:14,cy:86},
   {k:'cap',t:"STICK AROUND, CITIZEN. I'LL WALK YOU THROUGH THE WAR.",cx:70,cy:92,mw:48}]},
 {lbl:'PAGE 1',img:'pages/p1.png',items:[
   {k:'cap',t:'MERICA CITY. DISTRICT 12. YEAR 2577 PE.',cx:19,cy:7,mw:30},
   {k:'cap',t:'NEARLY FIVE HUNDRED YEARS OF WAR. WE JUST LIVE IN THE CROSSFIRE.',cx:20,cy:60,mw:30},
   {k:'bub',t:'...MOVE LEFT, YOU IDIOT. LEFT.',cx:80,cy:82,mw:24,tail:'dr'}]},
 {lbl:'PAGE 2',img:'pages/p2.png',items:[
   {k:'bub',t:"RAE DOESN'T LOSE. BEST HANDS IN DISTRICT 12.",cx:16,cy:64,mw:22,tail:'dl'},
   {k:'bub',t:'BEST HANDS IN A DEAD-END ARCADE. GREAT.',cx:80,cy:55,mw:22,tail:'dr'},
   {k:'bub',t:'FIGHT FOR A CORPO? NO THANKS.',cx:62,cy:78,mw:20,tail:'dl'}]},
 {lbl:'PAGE 3',img:'pages/p3.png',items:[
   {k:'sfx',t:'GDOOOM',cx:28,cy:24},
   {k:'bub',t:"STACK 'EM DEEP, BOYS!",cx:40,cy:42,mw:18,tail:'dl'},
   {k:'bub',t:"COLLATERAL'S JUST INVENTORY.",cx:52,cy:50,mw:20,tail:'dr'},
   {k:'bub',t:'ACCEPTABLE.',cx:16,cy:82,mw:16,tail:'dl'},
   {k:'cap',t:'ACCEPTABLE LOSSES, THE CORPOS CALL IT.',cx:78,cy:92,mw:26}]},
 {lbl:'PAGE 4',img:'pages/p4.png',items:[
   {k:'cap',t:'FOUR HUNDRED YEARS UNDER THEIR HEEL. 2577 IS THE YEAR THAT CHANGES.',cx:26,cy:8,mw:32},
   {k:'bub',t:'A BOT AND A REASON.',cx:78,cy:40,mw:22,tail:'dr'},
   {k:'cap',t:'THEY CALL IT CITIZEN COMBAT. I CALLED IT MY WAY IN.',cx:24,cy:74,mw:30}]},
 {lbl:'PAGE 5',img:'pages/p5.png',items:[
   {k:'bub',t:'WELCOME, CITIZEN. THE RITUAL WILL NOW ASSIGN YOUR BANNER.',cx:50,cy:13,mw:26,tail:'dl'},
   {k:'cap',t:'FIVE CORPOS WHO OWN EVERYTHING. THREE FACTIONS TRYING TO TAKE IT BACK.',cx:20,cy:58,mw:24},
   {k:'bub',t:"...THE ONE THEY'RE AFRAID OF. FIGURES.",cx:25,cy:71,mw:20,tail:'dr'},
   {k:'cap',t:'YOU CAN SWITCH BANNERS BETWEEN EVENTS. NOBODY IN DISTRICT 12 EVER BOTHERS.',cx:76,cy:60,mw:23}]},
 {lbl:'PAGE 6',img:'pages/p6.png',items:[
   {k:'cap',t:'THE ARMORY. YOUR UNIT SHIPS HOME BY MAGLEV.',cx:20,cy:8,mw:28},
   {k:'bub',t:"EVERY CITIZEN GETS ONE. FREE, SOULBOUND, YOURS TILL IT'S SCRAP.",cx:74,cy:20,mw:24,tail:'dl'},
   {k:'bub',t:"BASIC SOLDIER. LINE UNIT. DON'T GET ATTACHED.",cx:72,cy:46,mw:22,tail:'dr'},
   {k:'bub',t:"WE'LL SEE ABOUT THAT.",cx:24,cy:82,mw:20,tail:'dl'}]},
 {lbl:'PAGE 7',img:'pages/p7.png',items:[
   {k:'cap',t:'PILOT FROM OUTSIDE THE ZONE. LOSE THE BOT, LOSE THE PAYOUT.',cx:22,cy:8,mw:30},
   {k:'bub',t:"THEN I DON'T LOSE IT.",cx:50,cy:22,mw:20,tail:'dr'},
   {k:'cap',t:'LOG HAD A CLAIM ON DISTRICT 12. NOW IT HAS HANDS.',cx:22,cy:40,mw:26},
   {k:'bub',t:'WHERE’D THIS ROOKIE LEARN TO...',cx:20,cy:56,mw:22,tail:'dl'},
   {k:'sfx',t:'KRAK',cx:44,cy:82},
   {k:'cap',t:'LEFT. ALWAYS THE LEFT.',cx:80,cy:88,mw:22}]},
 {lbl:'PAGE 8',img:'pages/p8.png',items:[
   {k:'bub',t:'...BEST HANDS IN THE DISTRICT, HUH.',cx:20,cy:42,mw:24,tail:'dr'},
   {k:'bub',t:"THE WAR'S BEEN WAITING FOR SOMEONE LIKE YOU, CITIZEN.",cx:78,cy:44,mw:26,tail:'dl'},
   {k:'bub',t:"THEN IT CAN KEEP WAITING. I'M NOT FIGHTING FOR THEM. I'M FIGHTING FOR US.",cx:24,cy:82,mw:30,tail:'dl'},
   {k:'cap',t:"TAKEOVER CH.1 // END. NEXT: THE ARMORY'S PRICE.",cx:70,cy:93,mw:26}]},
];
const R=document.getElementById('R');
P.forEach((p,i)=>{
 const s=document.createElement('div');s.className='stage';
 let h=`<div class="pnum">${p.lbl}</div><img loading="lazy" src="${p.img}" alt="${p.lbl}"><div class="layer">`;
 (p.items||[]).forEach(o=>{
   if(o.k==='sfx')h+=`<div class="sfx" style="left:${o.cx}%;top:${o.cy}%">${o.t}</div>`;
   else if(o.k==='name')h+=`<div class="name" style="left:${o.cx}%;top:${o.cy}%">${o.t}</div>`;
   else h+=`<div class="${o.k}${o.tail?(' '+o.tail):''}" style="left:${o.cx}%;top:${o.cy}%;max-width:${o.mw}%">${o.t}</div>`;
 });
 h+=`</div>`;s.innerHTML=h;R.appendChild(s);
});
const e=document.createElement('div');e.className='end';
e.innerHTML=`<h2>THE WAR NEEDS HANDS.</h2><p>Every citizen gets one free, soulbound bot, and the Ritual is waiting to assign yours. Which banner will it give you?</p><a class="cta" href="https://www.fortblockgames.com/" target="_blank" rel="noopener">ENLIST YOUR BOT →</a>`;
R.appendChild(e);
</script></body></html>
