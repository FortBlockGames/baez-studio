<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TAKEOVER — Ch. 1 "Collateral"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#080a0f;--blue:#2B7FFF;--dim:#1c2030;--muted:#3a4055;--text:#cdd0db;--white:#f0f2f8;--border:rgba(255,255,255,0.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:'DM Sans',sans-serif}
header{position:static;background:rgba(8,10,15,.92);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:14px 22px}
.logo-w{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;color:var(--white)}
.logo-w small{color:var(--blue);font-size:12px;letter-spacing:3px;margin-left:10px}
.meta{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.reader{max-width:820px;margin:0 auto;padding:26px 12px 90px}
.page{margin:0 0 26px;position:relative;line-height:0}
.page img.art{width:100%;display:block;border-radius:6px;border:1px solid var(--border);background:#05060a;min-height:200px}
.layer{position:absolute;inset:0;line-height:1}
.pnum{position:absolute;top:10px;left:10px;z-index:5;background:rgba(8,10,15,.8);border:1px solid var(--border);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;padding:4px 9px;border-radius:6px}
/* transparent lettering placed INSIDE the art's own drawn bubbles */
.txt{position:absolute;transform:translate(-50%,-50%);text-align:center;color:#0a0a0a;
  font-family:'Anton',sans-serif;text-transform:uppercase;line-height:1.02;letter-spacing:.2px;
  font-size:clamp(7px,1.55vw,14px);text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 2px #fff}
.sfx{position:absolute;transform:translate(-50%,-50%) rotate(-7deg);text-align:center;color:#fff;
  -webkit-text-stroke:2.5px #111;font-family:'Anton',sans-serif;font-size:clamp(20px,5.4vw,46px);letter-spacing:1px}
/* styled caption/name boxes — used only where the art has NO drawn bubble (cover, narrator) */
.cap,.name{position:absolute;color:#111;text-transform:uppercase}
.cap{background:#fff;border:2px solid #111;font-family:'Anton',sans-serif;letter-spacing:.4px;line-height:1.06;
  padding:1.6% 1.9%;font-size:clamp(8px,1.66vw,15px);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.name{background:#111;color:#fff;font-family:'Bebas Neue',sans-serif;letter-spacing:1.5px;padding:.7% 1.4%;
  font-size:clamp(8px,1.5vw,13px);border-radius:2px}
.mark{position:absolute;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none}
.title{position:absolute;left:50%;transform:translateX(-50%);object-fit:contain}
.endcard{text-align:center;padding:60px 20px;border:1px dashed var(--dim);border-radius:12px}
.endcard h2{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:3px;color:var(--white)}
.endcard p{font-weight:300;font-size:14px;color:var(--muted);margin:12px auto 26px;max-width:440px;line-height:1.6}
.cta{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-family:'DM Mono',monospace;
  font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:15px 30px;border-radius:9px}
.cta:hover{background:#1f6ef0}
footer{text-align:center;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);padding:30px}
/* local preview only: outline the mark boxes so placement is visible even if an image is missing */
body.preview .mark,body.preview .title{outline:1px dashed rgba(255,0,255,.7);background:rgba(255,0,255,.08)}
</style>
</head>
<body>
<header>
  <div class="logo-w">TAKEOVER<small>CH. 1 · COLLATERAL</small></div>
  <div class="meta">FBG Universe · 2577 PE</div>
</header>
<div class="reader" id="reader"></div>
<footer>A FORT BLOCK GAMES MANGA · TEXTLESS ART PLATES + TYPESET LETTERING + COMPOSITED OFFICIAL LOGOS</footer>
<script>
const CDN='https://d8j0ntlcm91z4.cloudfront.net/user_367Twnt1CjgstYSJuY3u52mI2QL/';
const LOGO='../../assets/logos/';
// kinds: title (cover wordmark img) · mark (logo img, cx/cy/w center %) · txt (transparent text INTO a drawn bubble, cx/cy/w center %)
//        sfx (onomatopoeia into a drawn burst) · cap/name (styled box, x/y top-left — cover & narrator only, where art has no drawn bubble)
const PAGES = [
  { label:'COVER', url:CDN+'hf_20260723_170300_5e28db52-0ef2-401a-9d03-c74ab9d98fcf.jpeg', items:[
      {k:'title', src:'takeover-white.png', cy:1.4, w:44},
      {k:'cap', t:'CHAPTER ONE · COLLATERAL', x:31, y:13, w:38},
      {k:'cap', t:'AN FBG UNIVERSE MANGA', x:35, y:95, w:30},
  ]},
  { label:'McCLAINE · NARRATOR', url:CDN+'hf_20260722_202215_3b98fbfc-0ad8-418e-83e1-ab0bc4494d8f.png', items:[
      {k:'cap', t:'YEAR 2577. FIVE CORPOS OWN EVERYTHING.', x:4, y:3, w:38},
      {k:'cap', t:'EIGHT BANNERS FIGHT OVER EVERY DISTRICT. ALL OF THEM WITH BOTS LIKE ME.', x:62, y:5, w:32},
      {k:'name', t:'McCLAINE', x:5, y:84},
      {k:'cap', t:"STICK AROUND, CITIZEN. I'LL WALK YOU THROUGH THE WAR.", x:47, y:90.5, w:49},
  ]},
  { label:'PAGE 1', url:CDN+'hf_20260723_172509_32c2530e-6786-49a3-a767-09f9da3e304a.jpeg', items:[
      {k:'txt', t:'MERICA CITY. DISTRICT 12. YEAR 2577 PE.', cx:19, cy:8, w:23},
      {k:'txt', t:'NEARLY FIVE HUNDRED YEARS OF WAR. WE JUST LIVE IN THE CROSSFIRE.', cx:19, cy:56, w:24},
      {k:'txt', t:'...MOVE LEFT, YOU IDIOT. LEFT.', cx:84, cy:80, w:20},
  ]},
  { label:'PAGE 2', url:CDN+'hf_20260723_170320_3fc5a7ad-a976-48ea-9e57-77ce0ac94a76.jpeg', items:[
      {k:'txt', t:"RAE DOESN'T LOSE. BEST HANDS IN DISTRICT 12.", cx:80, cy:11, w:20},
      {k:'txt', t:'BEST HANDS IN A DEAD-END ARCADE. GREAT.', cx:55, cy:63, w:19},
      {k:'mark', src:'vital-vibe.png', cx:68, cy:74, w:12},
      {k:'txt', t:'FIGHT FOR A CORPO? NO THANKS.', cx:70, cy:90, w:20},
  ]},
  { label:'PAGE 3', url:CDN+'hf_20260723_172233_9fdc6fad-5691-4bad-9d6a-0ff41318ce1f.jpeg', items:[
      {k:'sfx', t:'GDOOOM', cx:30, cy:27},
      {k:'txt', t:"STACK 'EM DEEP, BOYS!", cx:43, cy:40, w:16},
      {k:'txt', t:"COLLATERAL'S JUST INVENTORY.", cx:52, cy:47, w:17},
      {k:'txt', t:'ACCEPTABLE.', cx:13, cy:80, w:15},
      {k:'txt', t:'ACCEPTABLE LOSSES, THE CORPOS CALL IT.', cx:82, cy:95, w:22},
  ]},
  { label:'PAGE 4', url:CDN+'hf_20260723_170420_e5e6e1fc-182b-4f3d-a06e-584d6f7a9a91.jpeg', items:[
      {k:'txt', t:'FOUR HUNDRED YEARS UNDER THEIR HEEL. 2577 IS THE YEAR THAT CHANGES.', cx:18, cy:9, w:22},
      {k:'txt', t:'A BOT AND A REASON.', cx:83, cy:11, w:18},
      {k:'txt', t:'THEY CALL IT CITIZEN COMBAT. I CALLED IT MY WAY IN.', cx:20, cy:48, w:22},
      {k:'txt', t:"YOU DON'T NEED THEIR PERMISSION TO FIGHT BACK. YOU NEED A BOT AND A REASON.", cx:82, cy:90, w:24},
  ]},
  { label:'PAGE 5', url:CDN+'hf_20260723_170426_7d9bd776-18ca-4077-8863-637e4121da10.jpeg', items:[
      {k:'txt', t:'WELCOME, CITIZEN. THE RITUAL WILL NOW ASSIGN YOUR BANNER.', cx:52, cy:8, w:23},
      {k:'mark', src:'chickows.png',      cx:6,  cy:40, w:7},
      {k:'mark', src:'aquafeelya.png',    cx:20, cy:44, w:8},
      {k:'mark', src:'vital-vibe.png',    cx:34, cy:45, w:8},
      {k:'mark', src:'digi-u.png',        cx:45, cy:46, w:8},
      {k:'mark', src:'dollar-holler.png', cx:57, cy:46, w:8},
      {k:'mark', src:'puf.png',           cx:69, cy:45, w:8},
      {k:'mark', src:'log.png',           cx:82, cy:44, w:8},
      {k:'mark', src:'sentioids.png',     cx:95, cy:40, w:7},
      {k:'txt', t:'FIVE CORPOS WHO OWN EVERYTHING. THREE FACTIONS TRYING TO TAKE IT BACK.', cx:22, cy:56, w:22},
      {k:'txt', t:"...THE ONE THEY'RE AFRAID OF. FIGURES.", cx:16, cy:86, w:20},
      {k:'mark', src:'log.png', cx:80, cy:87, w:10},
      {k:'txt', t:'YOU CAN SWITCH BANNERS BETWEEN EVENTS. NOBODY IN DISTRICT 12 EVER BOTHERS.', cx:85, cy:97, w:22},
  ]},
  { label:'PAGE 6', url:CDN+'hf_20260723_170441_4fb59ba9-a0b9-4a35-a766-53fea8a6e5bb.png', items:[
      {k:'txt', t:'THE ARMORY. YOUR UNIT SHIPS HOME BY MAGLEV.', cx:19, cy:8, w:24},
      {k:'txt', t:"EVERY CITIZEN GETS ONE. FREE, SOULBOUND, YOURS TILL IT'S SCRAP.", cx:80, cy:14, w:21},
      {k:'txt', t:"BASIC SOLDIER. LINE UNIT. DON'T GET ATTACHED.", cx:70, cy:38, w:21},
      {k:'txt', t:"WE'LL SEE ABOUT THAT.", cx:22, cy:80, w:20},
  ]},
  { label:'PAGE 7', url:CDN+'hf_20260723_172243_c4f8f4ee-2bfd-4a20-9b8a-edb97991521e.jpeg', items:[
      {k:'txt', t:'YOU PILOT FROM OUTSIDE THE ZONE.', cx:18, cy:8, w:23},
      {k:'txt', t:'LOSE THE BOT AND YOU LOSE THE PAYOUT.', cx:82, cy:30, w:22},
      {k:'txt', t:"THEN I DON'T LOSE IT.", cx:47, cy:9, w:19},
      {k:'txt', t:'LOG HAD A CLAIM ON DISTRICT 12. NOW IT HAS HANDS.', cx:20, cy:38, w:21},
      {k:'txt', t:'WHERE’D THIS ROOKIE LEARN TO...', cx:16, cy:50, w:18},
      {k:'sfx', t:'KRAK', cx:40, cy:80},
      {k:'txt', t:'LEFT. ALWAYS THE LEFT.', cx:82, cy:80, w:20},
  ]},
  { label:'PAGE 8', url:CDN+'hf_20260723_170502_860b3ce6-7cd3-4147-812e-890bea019b99.jpeg', items:[
      {k:'txt', t:'...BEST HANDS IN THE DISTRICT, HUH.', cx:16, cy:41, w:22},
      {k:'txt', t:"THE WAR'S BEEN WAITING FOR SOMEONE LIKE YOU, CITIZEN.", cx:80, cy:42, w:24},
      {k:'txt', t:"THEN IT CAN KEEP WAITING. I'M NOT FIGHTING FOR THEM. I'M FIGHTING FOR US.", cx:17, cy:80, w:26},
      {k:'txt', t:"TAKEOVER CH.1 // END. NEXT: THE ARMORY'S PRICE.", cx:74, cy:92, w:24},
  ]},
];
const reader=document.getElementById('reader');
PAGES.forEach((p)=>{
  const d=document.createElement('div');d.className='page';
  let html=`<div class="pnum">${p.label}</div><img class="art" loading="lazy" src="${p.url}" alt="${p.label}"><div class="layer">`;
  (p.items||[]).forEach(L=>{
    if(L.k==='title'){
      html+=`<img class="title" src="${LOGO+L.src}" style="top:${L.cy}%;width:${L.w}%">`;
    } else if(L.k==='mark'){
      html+=`<img class="mark" src="${LOGO+L.src}" style="left:${L.cx}%;top:${L.cy}%;width:${L.w}%">`;
    } else if(L.k==='txt'){
      html+=`<div class="txt" style="left:${L.cx}%;top:${L.cy}%;width:${L.w}%">${L.t}</div>`;
    } else if(L.k==='sfx'){
      html+=`<div class="sfx" style="left:${L.cx}%;top:${L.cy}%">${L.t}</div>`;
    } else { // cap / name — styled box at top-left
      const w=L.w?`width:${L.w}%;`:'';
      html+=`<div class="${L.k}" style="left:${L.x}%;top:${L.y}%;${w}">${L.t}</div>`;
    }
  });
  html+=`</div>`;
  d.innerHTML=html;
  reader.appendChild(d);
});
const end=document.createElement('div');end.className='endcard';
end.innerHTML=`<h2>THE WAR NEEDS HANDS.</h2>
<p>Rae got a banner. Every citizen gets one free, soulbound bot, and the Ritual is waiting to assign yours. Which banner will it give you? The Takeover is live.</p>
<a class="cta" href="https://www.fortblockgames.com/" target="_blank" rel="noopener">ENLIST YOUR BOT →</a>`;
reader.appendChild(end);
</script>
</body>
</html>
